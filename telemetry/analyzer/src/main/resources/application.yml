spring:
  application:
    name: analyzer
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://localhost:5433/analyzer
    username: analyzer
    password: analyzer
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: always

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

analyzer:
  kafka:
    topics:
      hubs: telemetry.hubs.v1
      snapshots: telemetry.snapshots.v1
    consumer:
      bootstrap-servers: localhost:9092
      snapshot-group-id: analyzer-snapshot-group
      hub-group-id: analyzer-hub-group
      auto-offset-reset: earliest
      max-poll-records: 10

logging:
  level:
    ru.yandex.practicum.analyzer: INFO

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true